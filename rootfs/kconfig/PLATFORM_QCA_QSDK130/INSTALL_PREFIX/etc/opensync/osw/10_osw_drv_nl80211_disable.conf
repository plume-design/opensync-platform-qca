# The SPF 13 is no longer relying on
# osw_drv_nl80211 base driver with customization
# sprinkled on top of it.
#
# Instead a from-scratch driver is implemented.
#
# Initially it will re-use some of the external
# components that osw_drv_nl80211 used itself, but
# it will compose instead of inherit logic.
OSW_DRV_NL80211_DISABLE=1
